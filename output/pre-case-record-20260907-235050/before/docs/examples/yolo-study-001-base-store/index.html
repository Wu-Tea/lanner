<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23183753'/%3E%3Cpath d='M8 9h16v4H13v3h9v4h-9v3h11v4H8z' fill='white'/%3E%3C/svg%3E">
  <title>历史实验 · yolo-study-001 Base Store 多视图样例</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#view-root">跳到当前资料</a>

  <aside style="padding:9px 16px;background:#fff3cd;border-bottom:1px solid #d6b85c;color:#594600;font:600 13px/1.5 'Segoe UI','Microsoft YaHei',sans-serif;">
    历史多视图实验：仅作为固定项目证据与交互对照，不代表当前产品实现主线。
  </aside>

  <header class="topbar">
    <div class="project-mark" aria-label="项目与固定版本">
      <span class="project-kicker">CASE BASE / FIXED SNAPSHOT</span>
      <strong id="project-title">yolo-study-001</strong>
      <span class="snapshot-pill" id="snapshot-pill">dev@9505591</span>
    </div>
    <div class="scope-line" id="scope-line">默认原生手柄路径 · 不含工作区修改</div>
  </header>

  <div class="workspace">
    <nav class="view-nav" aria-label="资料视图">
      <div class="nav-label">按问题查看</div>
      <div id="view-nav-items"></div>
      <div class="nav-foot">
        <span class="status-dot status-observed"></span>
        <span>固定提交中的事实</span>
        <span class="status-dot status-inferred"></span>
        <span>有来源的归纳</span>
      </div>
    </nav>

    <main class="main-column">
      <div class="focus-strip" aria-live="polite">
        <span>当前焦点</span>
        <button id="focus-chip" class="focus-chip" type="button"></button>
        <span id="focus-id" class="focus-id"></span>
      </div>

      <header class="view-heading">
        <div>
          <p id="view-family" class="eyebrow"></p>
          <h1 id="view-title"></h1>
          <p id="view-question" class="view-question"></p>
        </div>
        <div class="view-meta" id="view-meta"></div>
      </header>

      <section id="view-root" class="view-root" tabindex="-1" aria-live="polite"></section>
    </main>

    <aside class="inspector" aria-label="当前对象详情">
      <div class="inspector-sticky">
        <div class="inspector-label">对象说明</div>
        <div id="inspector-content"></div>
      </div>
    </aside>
  </div>

  <footer class="footer-note">
    <span id="base-revision"></span>
    <span>视图由同一 Base 生成；筛选、节点坐标和浏览历史不会写回 Base。</span>
  </footer>

  <template id="empty-template">
    <div class="empty-state">当前筛选下没有可展示的记录。</div>
  </template>

  <script src="base.fixture.js"></script>
  <script src="projection-specs.fixture.js"></script>
  <script src="app.js"></script>
</body>
</html>
